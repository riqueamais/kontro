name: release

# A tag e a fonte da versao: empurrar v2.1.0 gera a release 2.1.0. Assim o numero nunca
# fica duplicado entre o Cargo.toml, o tauri.conf.json e o repositorio.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # a anotacao da tag e a nota da release: sem o historico e sem as tags
          # o checkout traz so o commit, e a mensagem nao viria junto
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Versao a partir da tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $v = $tag -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Tag '$tag' nao esta no formato vX.Y.Z"
            exit 1
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "versao: $v"

      - name: Carimbar a versao no projeto
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"

          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $v
          $conf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json -Encoding utf8

          # so a primeira ocorrencia: a linha de versao do pacote vem antes das
          # dependencias, e trocar todas quebraria as versoes delas
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $cargo = [regex]::Replace($cargo, '(?m)^version = ".*?"$', "version = ""$v""", 1)
          Set-Content src-tauri/Cargo.toml $cargo -Encoding utf8

      - name: Instalar dependencias do front
        run: npm ci

      - name: Empacotar
        run: npx tauri build

      - name: Listar o que saiu
        shell: pwsh
        run: Get-ChildItem src-tauri/target/release/bundle -Recurse -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Publicar a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arquivos = (Get-ChildItem src-tauri/target/release/bundle -Recurse -File -Include *.exe, *.msi).FullName

          # A anotacao da tag e onde a release foi escrita para gente ler. Quando
          # existir, ela manda; sem ela, a lista de commits do GitHub ao menos diz
          # o que mudou.
          $notas = (git tag -l --format='%(contents)' "${{ github.ref_name }}") -join "`n"
          if ([string]::IsNullOrWhiteSpace($notas)) {
            gh release create "${{ github.ref_name }}" $arquivos `
              --title "Kontro ${{ github.ref_name }}" `
              --generate-notes
          } else {
            $notas | Out-File -FilePath notas.md -Encoding utf8
            gh release create "${{ github.ref_name }}" $arquivos `
              --title "Kontro ${{ github.ref_name }}" `
              --notes-file notas.md
          }

      - name: Guardar o instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: kontro-${{ steps.ver.outputs.version }}
          path: src-tauri/target/release/bundle/
