name: release

# A tag e a fonte da versao: empurrar v2.1.0 gera a release 2.1.0. Assim o numero nunca
# fica duplicado entre o Cargo.toml, o tauri.conf.json e o repositorio.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # a nota da release sai da anotacao da tag, e a versao sai do nome dela:
          # sem o historico completo nao ha nem uma coisa nem outra
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Trazer a anotacao da tag
        shell: pwsh
        run: |
          # O checkout deixa a tag como referencia leve, apontando direto para o commit.
          # `git tag -l --format=%(contents)` entao devolve a mensagem do commit, e a
          # release saia com o texto escrito para quem le codigo no lugar do escrito para
          # quem usa o app -- em silencio, porque a guarda de "sem anotacao" nunca via
          # vazio. Buscar a tag de novo, a forca, traz o objeto anotado de verdade.
          git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          $tipo = git cat-file -t "${{ github.ref_name }}"
          Write-Host "a tag e um objeto do tipo: $tipo"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Versao a partir da tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $v = $tag -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Tag '$tag' nao esta no formato vX.Y.Z"
            exit 1
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "versao: $v"

      - name: Carimbar a versao no projeto
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"

          # Trocar so a linha da versao. Um round-trip por ConvertFrom-Json/ConvertTo-Json
          # reescreve o arquivo inteiro, e leitura sem encoding declarado decodifica UTF-8
          # como ANSI: foi assim que o copyright e a descricao viraram lixo e dobraram de
          # tamanho a cada release, ate 2454 caracteres. Ler e gravar pelas APIs do .NET
          # deixa o encoding explicito nas duas pontas.
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $caminhoConf = Join-Path (Get-Location) "src-tauri/tauri.conf.json"
          $conf = [System.IO.File]::ReadAllText($caminhoConf, $utf8)
          $conferido = $false
          $conf = [regex]::Replace($conf, '(?m)^(\s*)"version": "[^"]*"', {
            param($m)
            if ($script:conferido) { return $m.Value }
            $script:conferido = $true
            return $m.Groups[1].Value + '"version": "' + $v + '"'
          })
          [System.IO.File]::WriteAllText($caminhoConf, $conf, $utf8)

          # A linha de versao do pacote vem antes das dependencias, entao so a
          # primeira troca. O padrao nao pode terminar em $: num checkout no Windows o
          # arquivo chega com CRLF, o \r fica entre a aspa e o fim da linha e o padrao
          # nunca casa. Foi assim que a 2.0.2 saiu se dizendo 2.0.0.
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $trocado = $false
          $cargo = [regex]::Replace($cargo, '(?m)^version = "[^"]*"', {
            param($m)
            if ($script:trocado) { return $m.Value }
            $script:trocado = $true
            return 'version = "' + $v + '"'
          })
          Set-Content src-tauri/Cargo.toml $cargo -Encoding utf8 -NoNewline

      - name: Conferir o carimbo
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"

          $noCargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' |
            Select-Object -First 1).Matches.Groups[1].Value
          $noConf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version

          Write-Host "tag=$v  cargo=$noCargo  conf=$noConf"
          if ($noCargo -ne $v -or $noConf -ne $v) {
            Write-Error "A versao nao foi carimbada em todos os lugares."
            exit 1
          }

          # "Ã" so aparece quando UTF-8 foi lido como ANSI. O copyright e a descricao vao
          # para o recurso de versao do .exe e para o instalador: se o carimbo estragar o
          # encoding de novo, a release para aqui em vez de sair com lixo nas propriedades.
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $bruto = [System.IO.File]::ReadAllText((Join-Path (Get-Location) "src-tauri/tauri.conf.json"), $utf8)
          if ($bruto.Contains([char]0x00C3)) {
            Write-Error "tauri.conf.json saiu com o encoding estragado pelo carimbo."
            exit 1
          }

      - name: Instalar dependencias do front
        run: npm ci

      - name: Empacotar
        env:
          # Assinar e o que permite ao app confiar no pacote que ele mesmo baixa. Sem
          # isto o updater recusa a atualizacao, e com razao.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Listar o que saiu
        shell: pwsh
        run: Get-ChildItem src-tauri/target/release/bundle -Recurse -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Publicar a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Cada passo roda num shell proprio: variavel definida la atras nao chega
          # aqui. Foi assim que o manifesto saiu com a versao nula e o app recusou a
          # atualizacao dizendo "invalid type: null".
          $v = "${{ steps.ver.outputs.version }}"

          # A anotacao da tag e onde a release foi escrita para gente ler, e ela serve
          # duas vezes: como nota da release e como `notes` do manifesto, que e o texto
          # que o proprio app mostra em Configuracoes ao encontrar versao nova.
          #
          # A conferencia do tipo e o que torna a escolha honesta: numa tag leve o
          # `%(contents)` cai na mensagem do commit, que nunca esta vazia, e o galho de
          # baixo jamais era alcancado.
          $notas = ""
          if ((git cat-file -t "${{ github.ref_name }}") -eq "tag") {
            $notas = (git tag -l --format='%(contents)' "${{ github.ref_name }}") -join "`n"
          }

          $arquivos = (Get-ChildItem src-tauri/target/release/bundle -Recurse -File -Include *.exe, *.msi, *.sig).FullName

          # O manifesto que o app consulta. O endereco fixo `latest/download/latest.json`
          # so funciona porque o arquivo entra como anexo da release.
          $instalador = Get-ChildItem src-tauri/target/release/bundle -Recurse -Filter *-setup.exe | Select-Object -First 1
          $assinatura = Get-Content "$($instalador.FullName).sig" -Raw
          $manifesto = @{
            version = $v
            notes = if ([string]::IsNullOrWhiteSpace($notas)) { "Veja a pagina da release para o que mudou." } else { $notas }
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $assinatura.Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($instalador.Name)"
              }
            }
          }
          $manifesto | ConvertTo-Json -Depth 10 | Set-Content latest.json -Encoding utf8

          $conferido = Get-Content latest.json -Raw | ConvertFrom-Json
          if (-not $conferido.version -or -not $conferido.platforms.'windows-x86_64'.signature) {
            Write-Error "O manifesto saiu incompleto -- o app recusaria a atualizacao."
            exit 1
          }

          $arquivos += (Resolve-Path latest.json).Path

          if ([string]::IsNullOrWhiteSpace($notas)) {
            gh release create "${{ github.ref_name }}" $arquivos `
              --title "Kontro ${{ github.ref_name }}" `
              --generate-notes
          } else {
            $notas | Out-File -FilePath notas.md -Encoding utf8
            gh release create "${{ github.ref_name }}" $arquivos `
              --title "Kontro ${{ github.ref_name }}" `
              --notes-file notas.md
          }

      - name: Guardar o instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: kontro-${{ steps.ver.outputs.version }}
          path: src-tauri/target/release/bundle/
