name: release

# Dois canais, um por branch. A main publica a versao estavel que esta no
# tauri.conf.json e a develop publica uma beta dessa versao, numerada pela
# execucao. O app so consulta o canal beta quando a pessoa liga a opcao.
on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # As tags anteriores e a anotacao da tag desta versao, quando existir,
          # so aparecem com o historico completo.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Decidir canal e versao
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $conf = [System.IO.File]::ReadAllText((Join-Path (Get-Location) "src-tauri/tauri.conf.json"), $utf8)
          $base = ([regex]::Match($conf, '(?m)^\s*"version": "([^"]+)"')).Groups[1].Value
          if ($base -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "A versao do tauri.conf.json ('$base') nao esta no formato X.Y.Z"
            exit 1
          }

          $canal = if ("${{ github.ref_name }}" -eq "main") { "estavel" } else { "beta" }
          $jaPublicada = (gh release view "v$base" --json tagName 2>$null) -ne $null

          if ($canal -eq "estavel") {
            if ($jaPublicada) {
              Write-Host "A v$base ja esta publicada. Suba a versao no package.json, no Cargo.toml e no tauri.conf.json para publicar outra."
              "pular=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              exit 0
            }
            $versao = $base
            $tag = "v$base"
          } else {
            # Uma beta precisa ficar acima da estavel que ja saiu: se a base ja
            # foi publicada, a beta e da correcao seguinte.
            if ($jaPublicada) {
              $partes = $base.Split('.')
              $base = "$($partes[0]).$($partes[1]).$([int]$partes[2] + 1)"
            }
            $versao = "$base-beta.${{ github.run_number }}"
            $tag = "beta"
          }

          "pular=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "canal=$canal" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$versao" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "canal: $canal  versao: $versao  tag: $tag"

      - name: Carimbar a versao no projeto
        if: steps.ver.outputs.pular == 'false'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"

          # Trocar so a linha da versao. Um round-trip por ConvertFrom-Json/ConvertTo-Json
          # reescreve o arquivo inteiro, e leitura sem encoding declarado decodifica UTF-8
          # como ANSI: foi assim que o copyright e a descricao viraram lixo e dobraram de
          # tamanho a cada release, ate 2454 caracteres. Ler e gravar pelas APIs do .NET
          # deixa o encoding explicito nas duas pontas.
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $caminhoConf = Join-Path (Get-Location) "src-tauri/tauri.conf.json"
          $conf = [System.IO.File]::ReadAllText($caminhoConf, $utf8)
          $conferido = $false
          $conf = [regex]::Replace($conf, '(?m)^(\s*)"version": "[^"]*"', {
            param($m)
            if ($script:conferido) { return $m.Value }
            $script:conferido = $true
            return $m.Groups[1].Value + '"version": "' + $v + '"'
          })
          [System.IO.File]::WriteAllText($caminhoConf, $conf, $utf8)

          # A linha de versao do pacote vem antes das dependencias, entao so a
          # primeira troca. O padrao nao pode terminar em $: num checkout no Windows o
          # arquivo chega com CRLF, o \r fica entre a aspa e o fim da linha e o padrao
          # nunca casa. Foi assim que a 2.0.2 saiu se dizendo 2.0.0.
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $trocado = $false
          $cargo = [regex]::Replace($cargo, '(?m)^version = "[^"]*"', {
            param($m)
            if ($script:trocado) { return $m.Value }
            $script:trocado = $true
            return 'version = "' + $v + '"'
          })
          Set-Content src-tauri/Cargo.toml $cargo -Encoding utf8 -NoNewline

      - name: Conferir o carimbo
        if: steps.ver.outputs.pular == 'false'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"

          $noCargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' |
            Select-Object -First 1).Matches.Groups[1].Value
          $noConf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version

          Write-Host "versao=$v  cargo=$noCargo  conf=$noConf"
          if ($noCargo -ne $v -or $noConf -ne $v) {
            Write-Error "A versao nao foi carimbada em todos os lugares."
            exit 1
          }

          # "Ã" so aparece quando UTF-8 foi lido como ANSI. O copyright e a descricao vao
          # para o recurso de versao do .exe e para o instalador: se o carimbo estragar o
          # encoding de novo, a release para aqui em vez de sair com lixo nas propriedades.
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $bruto = [System.IO.File]::ReadAllText((Join-Path (Get-Location) "src-tauri/tauri.conf.json"), $utf8)
          if ($bruto.Contains([char]0x00C3)) {
            Write-Error "tauri.conf.json saiu com o encoding estragado pelo carimbo."
            exit 1
          }

      - name: Instalar dependencias do front
        if: steps.ver.outputs.pular == 'false'
        run: npm ci

      - name: Empacotar
        if: steps.ver.outputs.pular == 'false'
        env:
          # Assinar e o que permite ao app confiar no pacote que ele mesmo baixa. Sem
          # isto o updater recusa a atualizacao, e com razao.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Listar o que saiu
        if: steps.ver.outputs.pular == 'false'
        shell: pwsh
        run: Get-ChildItem src-tauri/target/release/bundle -Recurse -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Escrever as notas
        if: steps.ver.outputs.pular == 'false'
        shell: pwsh
        run: |
          $canal = "${{ steps.ver.outputs.canal }}"
          $tag = "${{ steps.ver.outputs.tag }}"

          # Na estavel, uma tag anotada empurrada a mao continua valendo como nota
          # escrita para quem usa o app. Sem ela, e no canal beta, a nota e a lista
          # do que entrou desde a ultima estavel: os assuntos dos commits, que aqui
          # ja sao escritos como frases.
          $notas = ""
          if ($canal -eq "estavel" -and (git tag -l $tag) -and ((git cat-file -t $tag) -eq "tag")) {
            $notas = (git tag -l --format='%(contents)' $tag) -join "`n"
          }

          if ([string]::IsNullOrWhiteSpace($notas)) {
            $ultima = git tag -l 'v*' --sort=-v:refname | Where-Object { $_ -ne $tag } | Select-Object -First 1
            $faixa = if ($ultima) { "$ultima..HEAD" } else { "HEAD" }
            $assuntos = git log $faixa --no-merges --format='%s' |
              Where-Object { $_ -and $_ -notmatch '^Versao \d' }
            $linhas = @()
            if ($canal -eq "beta") {
              $linhas += "Versao beta, publicada a partir da develop antes da versao final."
              $linhas += ""
            }
            $linhas += "O que entrou"
            $linhas += ($assuntos | ForEach-Object { "- $_" })
            $notas = $linhas -join "`n"
          }

          $notas | Out-File -FilePath notas.md -Encoding utf8
          Get-Content notas.md

      - name: Publicar a release
        if: steps.ver.outputs.pular == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Cada passo roda num shell proprio: variavel definida la atras nao chega
          # aqui. Foi assim que o manifesto saiu com a versao nula e o app recusou a
          # atualizacao dizendo "invalid type: null".
          $v = "${{ steps.ver.outputs.version }}"
          $canal = "${{ steps.ver.outputs.canal }}"
          $tag = "${{ steps.ver.outputs.tag }}"
          $manifestoNome = if ($canal -eq "estavel") { "latest.json" } else { "beta.json" }

          $arquivos = (Get-ChildItem src-tauri/target/release/bundle -Recurse -File -Include *.exe, *.msi, *.sig).FullName

          # O manifesto que o app consulta. Na estavel ele mora em
          # `latest/download/latest.json`, que o GitHub aponta para a release estavel
          # mais nova. Na beta mora em `download/beta/beta.json`: uma release rolante,
          # sempre com a mesma tag, que cada build substitui por inteiro.
          $instalador = Get-ChildItem src-tauri/target/release/bundle -Recurse -Filter *-setup.exe | Select-Object -First 1
          $assinatura = Get-Content "$($instalador.FullName).sig" -Raw
          $notas = Get-Content notas.md -Raw
          $manifesto = @{
            version = $v
            notes = $notas.Trim()
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $assinatura.Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/$tag/$($instalador.Name)"
              }
            }
          }
          $manifesto | ConvertTo-Json -Depth 10 | Set-Content $manifestoNome -Encoding utf8

          $conferido = Get-Content $manifestoNome -Raw | ConvertFrom-Json
          if (-not $conferido.version -or -not $conferido.platforms.'windows-x86_64'.signature) {
            Write-Error "O manifesto saiu incompleto -- o app recusaria a atualizacao."
            exit 1
          }

          $arquivos += (Resolve-Path $manifestoNome).Path

          if ($canal -eq "estavel") {
            gh release create $tag $arquivos `
              --target "${{ github.sha }}" `
              --title "Kontro $tag" `
              --notes-file notas.md
          } else {
            # A tag `beta` anda junto com a develop. Apagar a release e a tag antes
            # de recriar garante que so o instalador desta build fica anexado.
            gh release delete $tag --cleanup-tag --yes 2>$null
            git push origin ":refs/tags/$tag" 2>$null
            gh release create $tag $arquivos `
              --target "${{ github.sha }}" `
              --prerelease `
              --title "Kontro $v" `
              --notes-file notas.md
          }

      - name: Guardar o instalador como artefato
        if: steps.ver.outputs.pular == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: kontro-${{ steps.ver.outputs.version }}
          path: src-tauri/target/release/bundle/
