[package]
name = "kontro"
version = "2.0.0"
description = "Bateria do seu controle, em tempo real, na bandeja do sistema."
authors = ["riqueamais"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "kontro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
resvg = "0.45"
tiny-skia = "0.11"
usvg = "0.45"

[dependencies.windows]
version = "0.62"
features = [
  "Foundation",
  "Foundation_Collections",
  "Devices_Bluetooth",
  "Gaming_Input",
  "System_Power",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Devices_Enumeration",
  "Devices_HumanInterfaceDevice",
  "Storage",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_WinRT",
  "Win32_UI_Input_XboxController",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
