  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  font-display: swap;\n  src: url(\"e376646b-7604-4e72-b55d-30f449771d0c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: #0B0E11; }\n  a { color: #5FE083; text-decoration: none; }\n  a:hover { color: #9BEDB0; }\n  ::selection { background: #5FE083; color: #0B1410; }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div style=\"font-family:'Space Grotesk', system-ui, sans-serif; color:#E8ECEF; background:#0B0E11; min-height:100vh\">\n\n  <header style=\"max-width:1080px; margin:0 auto; padding:28px 32px; display:flex; align-items:center; justify-content:space-between; gap:24px\">\n    <div style=\"display:flex; align-items:center; gap:12px\">\n      <img src=\"c11de03d-9429-4d82-a670-2b0f9a03926a\" width=\"36\" height=\"36\" alt=\"Kontro\">\n      <span style=\"font-size:20px; font-weight:700; letter-spacing:-0.02em\">Kontro<\u002Fspan>\n    <\u002Fdiv>\n    <nav style=\"display:flex; align-items:center; gap:24px; font-size:14px; color:#9AA4AD\">\n      <a href=\"#como-funciona\" style=\"color:#9AA4AD\">Como funciona<\u002Fa>\n      <a href=\"#no-cabo\" style=\"color:#9AA4AD\">No cabo<\u002Fa>\n      <a href=\"https://github.com/riqueamais/kontro\" style=\"color:#E8ECEF\">GitHub<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <section style=\"max-width:1080px; margin:0 auto; padding:56px 32px 72px; display:grid; grid-template-columns:1.15fr 0.85fr; gap:56px; align-items:center\">\n    <div style=\"display:flex; flex-direction:column; gap:24px\">\n      <div style=\"font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:#5FE083\">Windows · .NET 8 · MIT<\u002Fdiv>\n      <h1 style=\"margin:0; font-size:56px; line-height:1.05; font-weight:700; letter-spacing:-0.03em; text-wrap:balance\">Bateria do seu controle, em tempo real, na bandeja do sistema.<\u002Fh1>\n      <p style=\"margin:0; font-size:18px; line-height:1.6; color:#9AA4AD; max-width:52ch; text-wrap:pretty\">O ícone mostra a porcentagem exata e muda de cor conforme a carga cai. Quando não há controle ligado, ele vira um controle riscado. O app avisa quando a bateria fica baixa e estima quanto tempo ainda dá para jogar, a partir do consumo medido.<\u002Fp>\n      <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:14px; padding-top:4px\">\n        <a href=\"https://github.com/riqueamais/kontro/releases/latest\" style=\"display:inline-flex; align-items:center; gap:10px; height:52px; padding:0 26px; background:#5FE083; color:#0B1410; border-radius:10px; font-size:16px; font-weight:700\">Baixar o Setup.exe<\u002Fa>\n        <a href=\"https://github.com/riqueamais/kontro\" style=\"display:inline-flex; align-items:center; height:52px; padding:0 22px; border:1px solid #1E252C; border-radius:10px; font-size:16px; color:#E8ECEF\">Ver o código<\u002Fa>\n        <span style=\"font-family:'JetBrains Mono', monospace; font-size:12px; color:#6B757D\">instalação por usuário · sem admin<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column; gap:18px; align-items:center\">\n      <img src=\"d9eca83b-a3f0-4bce-a507-9b889ae7deaa\" width=\"188\" height=\"188\" alt=\"Ícone do Kontro\" style=\"filter:drop-shadow(0 24px 56px rgba(0,0,0,0.6))\">\n      <div style=\"display:flex; align-items:center; gap:16px; background:#202020; border:1px solid #1E252C; border-radius:12px; padding:12px 18px\">\n        <img src=\"1344d8fa-266b-4698-9562-9b075b977af1\" width=\"22\" height=\"22\" alt=\"100%\">\n        <img src=\"6ec2a088-8c55-4c0d-9524-12e3c1452e7e\" width=\"22\" height=\"22\" alt=\"75%\">\n        <img src=\"e0fe8664-5233-4482-a28c-d4393b1b1c38\" width=\"22\" height=\"22\" alt=\"50%\">\n        <img src=\"ea244cb1-b74f-411d-8826-52443a083c37\" width=\"22\" height=\"22\" alt=\"25%\">\n        <img src=\"00091f02-d5df-4f1c-b2f7-5d811bb6ebf9\" width=\"22\" height=\"22\" alt=\"10%\">\n        <img src=\"26ef3729-2bbb-426b-a743-23c8253aeea8\" width=\"22\" height=\"22\" alt=\"no cabo\">\n        <img src=\"929f3fc4-ad6d-4cd9-9c5b-de02cda64710\" width=\"22\" height=\"22\" alt=\"desconectado\">\n      <\u002Fdiv>\n      <span style=\"font-family:'JetBrains Mono', monospace; font-size:11px; color:#6B757D\">os estados do ícone, em tamanho real<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"como-funciona\" style=\"max-width:1080px; margin:0 auto; padding:24px 32px 88px; display:grid; grid-template-columns:1fr 1fr; gap:28px\">\n    <div style=\"background:#0F1318; border:1px solid #1E252C; border-radius:16px; padding:32px; display:flex; flex-direction:column; gap:16px\">\n      <h2 style=\"margin:0; font-size:24px; font-weight:700; letter-spacing:-0.02em\">Como ele lê a bateria<\u002Fh2>\n      <p style=\"margin:0; font-size:15px; line-height:1.65; color:#9AA4AD; text-wrap:pretty\">Controles sem fio expõem a carga pelo <strong style=\"color:#E8ECEF; font-weight:500\">GATT Battery Service<\u002Fstrong> do Bluetooth LE. É a mesma fonte que o Windows usa, dá o percentual exato de 0 a 100 e ainda suporta notificação: o controle avisa sozinho quando o nível muda, sem ninguém ficar perguntando.<\u002Fp>\n      <p style=\"margin:0; font-size:15px; line-height:1.65; color:#9AA4AD\">O Kontro não depende de marca nem de modelo. A descoberta funciona assim:<\u002Fp>\n      <ol style=\"margin:0; padding-left:22px; display:flex; flex-direction:column; gap:10px; font-size:15px; line-height:1.55; color:#9AA4AD\">\n        <li>Enumera dispositivos <strong style=\"color:#E8ECEF; font-weight:500\">HID<\u002Fstrong> cuja usage é gamepad, joystick ou multi-axis<\u002Fli>\n        <li>Extrai o endereço Bluetooth do id da interface<\u002Fli>\n        <li>Cruza com os dispositivos Bluetooth pareados<\u002Fli>\n      <\u002Fol>\n      <p style=\"margin:0; font-size:15px; line-height:1.65; color:#9AA4AD; text-wrap:pretty\">Quem não declara ser um controle nunca entra na lista. Teclado, mouse e fone continuam invisíveis para o app mesmo tendo bateria e estando pareados.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-direction:column; gap:28px\">\n      <div id=\"no-cabo\" style=\"background:#0F1318; border:1px solid #1E252C; border-radius:16px; padding:32px; display:flex; flex-direction:column; gap:16px\">\n        <h2 style=\"margin:0; font-size:24px; font-weight:700; letter-spacing:-0.02em\">O que acontece no cabo<\u002Fh2>\n        <p style=\"margin:0; font-size:15px; line-height:1.65; color:#9AA4AD; text-wrap:pretty\"><strong style=\"color:#E8ECEF; font-weight:500\">Não existe percentual quando o controle está no cabo.<\u002Fstrong> Isso não é limitação do app. Ao ser plugado, o controle troca de protocolo e o GATT Battery Service desaparece. O que sobra é a escala grosseira de quatro níveis do protocolo GIP, que erra feio: medindo um controle com 77% de carga real, ela reportava 100%.<\u002Fp>\n        <div style=\"display:flex; align-items:baseline; gap:14px; font-family:'JetBrains Mono', monospace; padding:14px 16px; background:#151A20; border-radius:10px\">\n          <span style=\"font-size:26px; font-weight:600; color:#5FE083\">77%<\u002Fspan>\n          <span style=\"font-size:13px; color:#6B757D\">real<\u002Fspan>\n          <span style=\"flex:1\"><\u002Fspan>\n          <span style=\"font-size:26px; font-weight:600; color:#F2564E\">100%<\u002Fspan>\n          <span style=\"font-size:13px; color:#6B757D\">reportado pelo GIP<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:15px; line-height:1.65; color:#9AA4AD; text-wrap:pretty\">Por isso, no cabo, o Kontro mostra a última leitura conhecida com o horário em vez de inventar um número. Mostrar nada é melhor que mostrar errado.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"background:#0F1318; border:1px solid #1E252C; border-radius:16px; padding:32px; display:flex; flex-direction:column; gap:18px\">\n        <h2 style=\"margin:0; font-size:24px; font-weight:700; letter-spacing:-0.02em\">Configuração<\u002Fh2>\n        <p style=\"margin:0; font-size:15px; line-height:1.65; color:#9AA4AD\">Pelo ícone na bandeja você ajusta:<\u002Fp>\n        <ul style=\"margin:0; padding-left:22px; display:flex; flex-direction:column; gap:10px; font-size:15px; line-height:1.5; color:#9AA4AD\">\n          <li>Iniciar com o Windows e iniciar minimizado<\u002Fli>\n          <li>O que o botão X faz: minimizar para a bandeja ou encerrar o app<\u002Fli>\n          <li>Limiares de aviso de bateria baixa e crítica<\u002Fli>\n          <li>Verificação automática de atualizações<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1080px; margin:0 auto; padding:0 32px 96px; display:grid; grid-template-columns:0.9fr 1.1fr; gap:48px; align-items:center\">\n    <div style=\"display:flex; flex-direction:column; gap:16px\">\n      <h2 style=\"margin:0; font-size:24px; font-weight:700; letter-spacing:-0.02em\">Instalação<\u002Fh2>\n      <p style=\"margin:0; font-size:15px; line-height:1.65; color:#9AA4AD; text-wrap:pretty\">Baixe o <span style=\"font-family:'JetBrains Mono', monospace; font-size:14px; color:#E8ECEF\">Setup.exe<\u002Fspan> da <a href=\"https://github.com/riqueamais/kontro/releases/latest\">última release<\u002Fa>. A instalação é por usuário, não pede administrador, e o app se atualiza sozinho a partir das releases publicadas no repositório.<\u002Fp>\n      <div style=\"display:flex; gap:12px; padding:14px 16px; background:#151A20; border-left:1px solid #5FE083; border-radius:0 10px 10px 0; font-size:14px; line-height:1.6; color:#9AA4AD\">O Windows 11 esconde ícones novos da bandeja atrás da setinha <span style=\"font-family:'JetBrains Mono', monospace; color:#E8ECEF\">^<\u002Fspan>. Arraste o ícone do Kontro para fora uma vez e ele fica fixo.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; justify-content:center\">\n      <div style=\"width:320px; background:#0B0E11; border:1px solid #1E252C; border-radius:16px; padding:16px; box-shadow:0 22px 48px rgba(0,0,0,0.6); display:flex; flex-direction:column; gap:14px\">\n        <div style=\"display:flex; align-items:center; gap:14px\">\n          <svg width=\"76\" height=\"76\" sc-camel-view-box=\"0 0 100 100\">\n            <circle cx=\"50\" cy=\"50\" r=\"42\" fill=\"none\" stroke=\"#FFFFFF\" stroke-opacity=\"0.13\" sc-camel-stroke-width=\"9\"><\u002Fcircle>\n            <circle cx=\"50\" cy=\"50\" r=\"42\" fill=\"none\" stroke=\"#5FE083\" sc-camel-stroke-width=\"9\" sc-camel-stroke-linecap=\"round\" sc-camel-stroke-dasharray=\"190 264\" transform=\"rotate(-90 50 50)\"><\u002Fcircle>\n            <text x=\"50\" y=\"57\" sc-camel-text-anchor=\"middle\" sc-camel-font-size=\"22\" sc-camel-font-weight=\"600\" fill=\"#E8ECEF\" sc-camel-font-family=\"Space Grotesk, sans-serif\">72%<\u002Ftext>\n          <\u002Fsvg>\n          <div style=\"display:flex; flex-direction:column; gap:5px\">\n            <div style=\"font-size:16px; color:#E8ECEF\">Controle sem fio<\u002Fdiv>\n            <div style=\"font-size:14px; color:#9AA4AD\">~4 h 20 min de jogo<\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono', monospace; font-size:12px; color:#6B757D\">lido às 21:04<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:1px; background:#1E252C\"><\u002Fdiv>\n        <div style=\"display:flex; gap:8px\">\n          <div style=\"flex:1; height:36px; border:1px solid #1E252C; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; color:#E8ECEF\">Configurações<\u002Fdiv>\n          <div style=\"flex:1; height:36px; background:#5FE083; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; color:#0B1410\">Atualizar<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"border-top:1px solid #1E252C\">\n    <div style=\"max-width:1080px; margin:0 auto; padding:28px 32px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; font-family:'JetBrains Mono', monospace; font-size:12px; color:#6B757D\">\n      <span>Kontro · licença MIT · requer .NET 8<\u002Fspan>\n      <div style=\"display:flex; gap:20px\">\n        <a href=\"https://github.com/riqueamais/kontro\">Repositório<\u002Fa>\n        <a href=\"https://github.com/riqueamais/kontro/releases/latest\">Releases<\u002Fa>\n        <a href=\"https://github.com/riqueamais/kontro/issues\">Issues<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
<script>
(function () {
  // O bundle desta pagina reconstroi o <head> ao iniciar: ele cria o proprio title,
  // viewport e description, e descarta tudo que veio no HTML. Duas consequencias:
  // o navegador perde os icones declarados e cai no /favicon.ico da raiz do dominio,
  // e o buscador -- que executa JavaScript -- acaba indexando a pagina sem metadado.
  //
  // Reaplicamos depois que ele termina, e ficamos vigiando para o caso de ele mexer
  // de novo. O HTML servido continua trazendo as mesmas tags, entao quem nao executa
  // script tambem enxerga tudo.
  var BASE = 'https://riqueamais.github.io/kontro/';
  var TITULO = 'Kontro · bateria do controle Xbox na bandeja do Windows';
  var DESCRICAO = 'Aplicativo gratuito e de código aberto para Windows que mostra a bateria do controle Xbox em tempo real na bandeja do sistema, lendo pelo Bluetooth.';
  var LD = '{"@context":"https://schema.org","@type":"SoftwareApplication","name":"Kontro","description":"Aplicativo gratuito e de código aberto para Windows que mostra a bateria do controle Xbox em tempo real na bandeja do sistema, lendo pelo Bluetooth.","url":"https://riqueamais.github.io/kontro/","downloadUrl":"https://github.com/riqueamais/kontro/releases/latest","softwareVersion":"1.1.1","applicationCategory":"UtilitiesApplication","operatingSystem":"Windows 10, Windows 11","inLanguage":"pt-BR","license":"https://github.com/riqueamais/kontro/blob/main/LICENSE","isAccessibleForFree":true,"offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"author":{"@type":"Person","name":"riqueamais","url":"https://github.com/riqueamais"},"image":"https://riqueamais.github.io/kontro/banner.png","screenshot":"https://riqueamais.github.io/kontro/banner.png"}';
  var ALT = 'Kontro: o icone de anel mostrando a carga do controle na bandeja do Windows';

  var metas = [
    ['name', 'description', DESCRICAO],
    ['name', 'robots', 'index, follow, max-image-preview:large'],
    ['name', 'theme-color', '#0B0E11'],
    ['name', 'author', 'riqueamais'],
    ['property', 'og:type', 'website'],
    ['property', 'og:site_name', 'Kontro'],
    ['property', 'og:locale', 'pt_BR'],
    ['property', 'og:title', TITULO],
    ['property', 'og:description', DESCRICAO],
    ['property', 'og:url', BASE],
    ['property', 'og:image', BASE + 'banner.png'],
    ['property', 'og:image:width', '1280'],
    ['property', 'og:image:height', '640'],
    ['property', 'og:image:alt', ALT],
    ['name', 'twitter:card', 'summary_large_image'],
    ['name', 'twitter:title', TITULO],
    ['name', 'twitter:description', DESCRICAO],
    ['name', 'twitter:image', BASE + 'banner.png'],
    ['name', 'twitter:image:alt', ALT]
  ];

  var links = [
    ['icon', BASE + 'favicon.ico', null, null],
    ['icon', BASE + 'icon-32.png', 'image/png', '32x32'],
    ['icon', BASE + 'icon-128.png', 'image/png', '128x128'],
    ['apple-touch-icon', BASE + 'icon-256.png', null, null],
    ['manifest', BASE + 'site.webmanifest', null, null],
    ['canonical', BASE, null, null]
  ];

  // A tipografia do design e fixa e nao encolhe: em 390px de largura o titulo de
  // 56px ocupa a tela inteira com duas palavras por linha. clamp() mantem o tamanho
  // original no desktop e reduz de forma continua conforme a tela estreita, sem
  // precisar de ponto de quebra.
  var CSS = [
    'h1{font-size:clamp(30px,7.2vw,56px)!important;line-height:1.08!important;',
    'letter-spacing:-.02em!important;overflow-wrap:break-word!important}',
    'h2{font-size:clamp(19px,3.4vw,24px)!important;line-height:1.2!important}',
    '@media (max-width:640px){',
    'body{-webkit-text-size-adjust:100%}',
    'img,svg,canvas{max-width:100%!important;height:auto!important}',
    '}'
  ].join('');

  function garantirMeta(chave, nome, valor) {
    var el = document.head.querySelector('meta[' + chave + '="' + nome + '"]');
    if (!el) {
      el = document.createElement('meta');
      el.setAttribute(chave, nome);
      document.head.appendChild(el);
    }
    if (el.getAttribute('content') !== valor) el.setAttribute('content', valor);
  }

  function garantirLink(rel, href, tipo, tamanhos) {
    var seletor = 'link[rel="' + rel + '"]' + (tamanhos ? '[sizes="' + tamanhos + '"]' : '');
    var el = document.head.querySelector(seletor);
    if (!el) {
      el = document.createElement('link');
      el.setAttribute('rel', rel);
      if (tipo) el.setAttribute('type', tipo);
      if (tamanhos) el.setAttribute('sizes', tamanhos);
      document.head.appendChild(el);
    }
    if (el.getAttribute('href') !== href) el.setAttribute('href', href);
  }

  var aplicando = false;

  function aplicar() {
    if (aplicando) return;
    aplicando = true;
    try {
      document.documentElement.lang = 'pt-BR';
      if (document.title !== TITULO) document.title = TITULO;

      metas.forEach(function (m) { garantirMeta(m[0], m[1], m[2]); });
      links.forEach(function (l) { garantirLink(l[0], l[1], l[2], l[3]); });

      if (!document.getElementById('kontro-ld')) {
        var s = document.createElement('script');
        s.id = 'kontro-ld';
        s.type = 'application/ld+json';
        s.textContent = LD;
        document.head.appendChild(s);
      }
      if (!document.getElementById('kontro-responsivo')) {
        var e = document.createElement('style');
        e.id = 'kontro-responsivo';
        e.textContent = CSS;
        document.head.appendChild(e);
      }
    } finally { aplicando = false; }
  }

  aplicar();
  document.addEventListener('DOMContentLoaded', aplicar);
  window.addEventListener('load', aplicar);

  // o bundle pode reconstruir o head depois; a vigilancia devolve o que ele levar
  new MutationObserver(function () {
    clearTimeout(window.__kontroTimer);
    window.__kontroTimer = setTimeout(aplicar, 60);
  }).observe(document.documentElement, { childList: true, subtree: true });
})();

</script>
